<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>*{font-family:system-ui}[data-go]{touch-action:manipulation;cursor:pointer}.b{padding:16px 24px;font-size:24px;background:#000;color:#fff;border:2px solid #fff;border-radius:8px;cursor:pointer}.n{font-size:28px;color:#fff;cursor:pointer;padding:20px 40px;border:2px solid #fff;border-radius:12px}.f{appearance:none;background:#000;color:#fff;border:1px solid #333;border-radius:8px}.ni{padding:6px 0;color:#aaa;border-bottom:1px solid #222;display:flex;align-items:center}.nx{background:none;border:1px solid #555;color:#888;padding:12px 20px;margin-right:10px;border-radius:4px;cursor:pointer;font-size:16px}.sb{background:#111;color:#fff;border:1px solid #444;border-radius:6px;padding:6px 12px;margin-right:6px;cursor:pointer;font:13px monospace}.pg{display:block;margin:8px 0;padding:16px 26px;font-size:21px;color:#fff;background:#000;border:1px solid #fff;border-radius:12px;cursor:pointer;touch-action:manipulation}.pg:active{background:#222}.v{position:absolute;inset:0;height:100vh;display:flex;flex-direction:column;visibility:hidden}.v.on{visibility:visible}.oc{display:flex;flex-direction:column;align-items:center;justify-content:center;height:46px;box-sizing:border-box;padding:2px 8px;border:1px solid #2a2a2a;border-radius:6px;min-width:0}.oc b{font-size:10px;font-weight:400;color:#777;white-space:nowrap}.oc select{appearance:none;background:#000;border:0;color:#fff;font-size:14px;text-align:center;min-width:0;max-width:100%;text-overflow:ellipsis;outline:none}option{font-size:16px;background:#000;color:#fff}</style>
<body style="margin:0;height:100vh;background:#000;overflow:hidden">
<span id=pms style="position:fixed;top:2px;right:6px;font:12px monospace;color:#fff;background:#000a;padding:2px 6px;z-index:9998;pointer-events:none"></span>
<span id=pf style="position:fixed;top:22px;right:6px;z-index:9997;font:13px monospace;color:#fff;background:#000;border:1px solid #333;border-radius:6px;padding:4px 10px;cursor:pointer;touch-action:manipulation">profile</span>
<iframe id=pfp style="position:fixed;top:52px;right:6px;width:min(440px,94vw);height:70vh;background:#000;border:1px solid #333;border-radius:8px;z-index:9997;display:none"></iframe>
<script>(()=>{let o=0;const c=document.getElementById('pf'),p=document.getElementById('pfp');
c.onclick=()=>{o=!o;p.style.display=o?'block':'none';if(o)fetch('/api/omni',{method:'POST',body:'q=profile htmlbody'}).then(r=>r.text()).then(t=>{const i=t.indexOf('<!doctype'),j=t.lastIndexOf('</pre>');p.srcdoc=i<0?t:t.slice(i,j>i?j:t.length)})}})()</script>
<div id=v_index class=v style="align-items:center;overflow-y:auto">
  <form id=omni autocomplete=off style="margin-top:9vh;width:min(96vw,600px);background:#000;border:1px solid #333;border-radius:8px"><textarea id=qi rows=1 autofocus autocomplete=off autocapitalize=off autocorrect=off spellcheck=false placeholder="" style="width:100%;font-size:24px;padding:16px 16px 6px;text-align:center;background:none;color:#fff;border:0;outline:none;caret-color:#fff;resize:none;overflow-y:auto;max-height:50vh;box-sizing:border-box"></textarea>
  <div style="display:flex;justify-content:center;gap:4px;padding:6px;border-top:1px solid #2a2a2a"><div class=oc><b>sends to &#9662;</b><select id=agb onchange="agsel(this.selectedIndex);qi.oninput()"><option>claude</option><option>codex</option><option>gemini</option><option>grok</option><option>note</option><option>task</option></select></div><div class=oc><b>run on &#9662;</b><select id=dev>__DO__</select></div></div></form>
  <div style="text-align:center;margin-top:8px"><span id=qh style="color:#555;font-size:15px">tap a page · or type a command / prompt</span></div>
  <div id=qo style="width:90vw;max-width:800px;margin-top:24px"></div>
  <script src="/bm?js" defer></script>
</div>
<div id=v_ag class=v style="align-items:center;justify-content:center;gap:14px"></div>
<div id=v_clock class=v style="flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000"><div id=ckt style="font:700 15vw ui-monospace,monospace;color:#fff"></div><div id=ckd style="color:#bbb;font:26px ui-monospace,monospace"></div><div id=ckl style="color:#888;font:16px ui-monospace,monospace"></div></div><!-- clock v1 (Sean 2026-08-31): time only, AM/PM, per-tick transition ms — a-time start -->
<div id=v_term class=v>
  <iframe id=tif style="flex:1;width:100%;border:0;background:#000"></iframe>
</div>
<iframe id=v_tasks class=v style="width:100%;border:0"></iframe>
<div id=v_note class=v style="padding-top:20px;align-items:center">
  <form id=nf style="display:flex;flex-direction:column;gap:10px;width:95vw">
    <textarea id=nc autofocus rows=1 placeholder="note — type, enter to save (shift-enter newline)" class=f style="width:100%;font-size:16px;padding:22px;box-sizing:border-box;resize:none;overflow:hidden" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();nf.requestSubmit()}"></textarea>
    <div style="display:flex;gap:10px">
      <button class=b type=submit style="flex:1">save</button>
      <button class=b type=button onclick="var n=0;ns.textContent='⟳ syncing…';fetch('/api/sync',{method:'POST'});var p=setInterval(()=>fetch('/api/sync-status').then(r=>r.text()).then(t=>{if(t=='syncing')ns.textContent='⟳ syncing… '+(++n)+'s';else{clearInterval(p);ns.textContent='✓ synced '+t;fetch('/note-list').then(r=>r.text()).then(h=>nl.innerHTML=h)}}),1000)">sync</button>
      <button class=b type=button data-go="/term">term</button>
    </div>
  </form>
  <div id=ns style="width:95vw;min-height:24px;margin-top:8px;font-size:18px;word-break:break-all"></div>
  <div id=nl style="width:95vw;overflow-y:auto;flex:1;margin-top:10px">__NO__</div>
</div>
<script>
var views={'/':'v_index','/term':'v_term','/note':'v_note','/tasks':'v_tasks','/ag':'v_ag','#clock':'v_clock'};
function _pm(t,l){pms.textContent=l+' DOM '+(performance.now()-t).toFixed(3)+'ms'}
function go(p,t=performance.now()){history.pushState(null,'',p);show(p);_pm(t,'nav '+p)}
/* clock: wake 8ms early + spin to the boundary (jitter < quantum; only while view on + tab visible — hidden throttles → 'bg untimed'); quantum = browser clamp, measured, shown */
var _ckQ=(function(){var a=performance.now(),b=a;while(b===a&&performance.now()-a<6)b=performance.now();return b>a?b-a:.001})(),_ckTg=0;
function _ckP(x){return String(x).padStart(2,'0')}
function _ck(){var on=v_clock.classList.contains('on')&&!document.hidden;
if(on&&_ckTg)while(performance.now()<_ckTg){}
var late=_ckTg?performance.now()-_ckTg:0,d=new Date(),h=d.getHours();
ckt.textContent=(h%12||12)+':'+_ckP(d.getMinutes())+':'+_ckP(d.getSeconds())+' '+(h<12?'AM':'PM');
ckd.textContent=d.toDateString().slice(0,3)+' '+d.getFullYear()+'-'+_ckP(d.getMonth()+1)+'-'+_ckP(d.getDate());
ckl.textContent='transition +'+late.toFixed(3)+'ms · clock step '+_ckQ.toFixed(3)+'ms'+(on?'':' · bg untimed');
var w=1000-Date.now()%1000;_ckTg=performance.now()+w;setTimeout(_ck,Math.max(0,w-8));}_ck();
function show(p){for(var k in views)window[views[k]].classList.toggle('on',k===p);if(p==='/term'){if(!tif.src)tif.src='/op';setTimeout(function(){try{tif.contentWindow.focus()}catch(e){}},50);}if(p==='/note'){setTimeout(function(){nc.focus()},0);fetch('/note-list').then(r=>r.text()).then(h=>nl.innerHTML=h);}if(p==='/'){qi.oninput();v_tasks.src='/tasks'}}
function arcn(f,el){fetch('/api/note/archive',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({f:f})});el.parentElement.remove();}
window.onpopstate=function(){show(views[location.hash]?location.hash:location.pathname);}; /* hash views (#clock) reload/back clean — /clock would 404 (no C route) */
nf.onsubmit=function(e){e.preventDefault();var c=nc.value.trim();if(!c)return;nc.value='';nc.style.height='auto';ns.innerHTML='<span style="color:#ccc">⟳ syncing… </span>'+c;fetch('/note',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'c='+encodeURIComponent(c)}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){var m=t.match(/https?:\/\/\S+/);if(m)ns.innerHTML='<span style="color:#ccc">saved → </span><a href="'+m[0]+'" target=_blank style="color:#fff">'+m[0]+'</a>';else ns.textContent=t.split('\n').filter(function(l){return l.trim().indexOf('saved')===0})[0]||'saved ✓';fetch('/note-list').then(function(r){return r.text()}).then(function(h){nl.innerHTML=h})}).catch(function(){ns.innerHTML='<span style="color:#fff">save FAILED</span>'});};
// Navigate on press, retaining the input timestamp.
var _act='[data-go],.pg,button,a[href],[onclick]',_in='input,select,textarea';
addEventListener('pointerdown',function(e){if(e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
  var t=e.target.closest(_act);if(!t||e.target.closest(_in))return;
  e.preventDefault();var g=t.closest('[data-go],[data-p]');g?navpage(g.dataset.go||g.dataset.p,e.timeStamp):t.click();},true);
addEventListener('click',function(e){if(!e.isTrusted)return;if(e.target.closest(_act)&&!e.target.closest(_in)){e.stopImmediatePropagation();e.preventDefault();}},true);
qi.onblur=function(){setTimeout(function(){if(document.activeElement===document.body)qi.focus()},0)};
window.onfocus=function(){omni.style.borderColor='#555'};window.onblur=function(){omni.style.borderColor='#333'};
var _cmds=[__CMDS__],_cs=0;
_cmds.sort(function(a,b){function h(c){return c[1]==='page'||views['/'+c[0]]?1:0}return h(b)-h(a)});
// web interfaces = the primary launchables: prepopulated (freq-sorted) by default, favored on type
var PAGES=[['/bm','a bm'],['/review','a review'],['/op','a op'],['/fw','a fleet'],['/music','a music'],['/note','a note'],['/tasks','a tasks'],['/flow','flow'],['#clock','a clock'],['/term','a term'],['/book','a book'],['/book?sort=author','authors'],['/docs','a docs']];
/* agent/type picker: own PAGE (v_ag), not a dropdown — go('/ag') is a DOM toggle, <1ms like all nav */
var AGO=[['c','claude'],['co','codex'],['g','gemini'],['grok','grok'],['note','note'],['task','task']],AG=0;
try{for(var _ai=0;_ai<AGO.length;_ai++)if(AGO[_ai][0]===localStorage.agm)AG=_ai}catch(e){}
agb.value=AGO[AG][1];
function fitsel(s){var c=fitsel.c||(fitsel.c=document.createElement('canvas').getContext('2d'));c.font='14px system-ui';s.style.width=c.measureText(s.selectedOptions[0].text).width+8+'px'}
fitsel(dev);
function agv(){return AGO[AG][0]}
v_ag.innerHTML='<div style="color:#555;font-size:16px">enter sends to</div>'+AGO.map(function(a,i){return '<div class=n id=ago'+i+' onclick="agset('+i+')" style="min-width:200px;text-align:center">'+a[1]+'</div>'}).join('')+'<div style="color:#555;font-size:13px">1–'+AGO.length+' select · ↑↓ move · esc back</div>';
function agsel(i){AG=(i+AGO.length)%AGO.length;try{localStorage.agm=agv()}catch(e){}agb.value=AGO[AG][1];for(var j=0;j<AGO.length;j++){var s=j===AG,el=window['ago'+j];el.style.background=s?'#fff':'#000';el.style.color=s?'#000':'#fff'}}
function agset(i){agsel(i);go('/');qi.focus()}
agsel(AG);
function gsearch(){var q=qi.value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank')}
function sav(k,t){qi.value='';qi.style.height='auto';qo.innerHTML='<div style="padding:10px 16px;color:#ccc;font-size:17px">⟳ '+k+'… '+t.slice(0,120).replace(/</g,'&lt;')+'</div>';
  fetch(k=='note'?'/note':'/api/omni',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:k=='note'?'c='+encodeURIComponent(t):'q='+encodeURIComponent('task add '+t)}).then(function(r){return r.text()}).then(function(x){var m=x.match(/https?:\/\/[^\s<]+/);qo.innerHTML='<div style="padding:10px 16px;color:#ccc;font-size:17px">✓ '+k+' saved'+(m?' → <a href="'+m[0]+'" target=_blank style=color:#fff>'+m[0]+'</a>':'')+'</div>';qi.focus()}).catch(function(){qo.innerHTML='<div style="padding:10px 16px;color:#fff;font-size:16px">✗ '+k+' failed</div>'})}
function pfreq(r){try{return +(localStorage['pf'+r]||0)}catch(e){return 0}}
function navpage(r,t){try{localStorage['pf'+r]=pfreq(r)+1}catch(e){}if(views[r])go(r,t);else location.href=r}
function _sg(){return qo.querySelectorAll('[data-p],[data-c],[data-a],[data-g],[data-n]')}
function hl(){var it=_sg();it.forEach(function(el,i){var s=i===_cs;el.style.background=s?'#fff':'';el.style.color=s?'#000':el.dataset.c?'#555':el.dataset.a?'#fff':el.dataset.g?'#aaa':el.dataset.n?'#999':''})}
qi.oninput=function(){var _t=performance.now(),v=qi.value.toLowerCase();_cs=0;qi.style.height='auto';qi.style.height=qi.scrollHeight+'px';
  var pg=PAGES.slice().sort(function(a,b){return pfreq(b[0])-pfreq(a[0])});
  if(v)pg=pg.filter(function(p){return p[1].indexOf(v)>=0||p[0].slice(1).indexOf(v)>=0});
  var ph=pg.length?'<div style="margin-bottom:16px">'+pg.map(function(p){return '<div class=pg data-p="'+p[0]+'" onclick="navpage(this.dataset.p)">'+p[1]+'</div>'}).join('')+'</div>':'';
  var ch='';if(v)ch=_cmds.filter(function(c){return c[0].indexOf(v)>=0}).slice(0,10).map(function(c,i){var w=c[0].slice(0,8)==='web http';return '<div data-c="'+c[0]+'" style="padding:8px 16px;color:'+(i?'#555':'#fff')+';cursor:pointer;font-size:18px" onclick="'+(w?"window.open(this.dataset.c.slice(4),'_blank')":"qi.value=this.dataset.c;omni.requestSubmit()")+'">'+(w?'↗ '+c[0].slice(4):'a '+c[0])+(c[1]?' <span style=color:#333>'+c[1]+'</span>':'')+'</div>'}).join('');
  var raw=qi.value.trim(),ci='',pv=(raw.length>120?raw.slice(0,120)+'…':raw).replace(/</g,'&lt;');
  if(raw&&!/^\d+$/.test(v))
    ci='<div data-a=1 onclick="omni.requestSubmit()" style="padding:10px 16px;color:#fff;cursor:pointer;font-size:18px">↵ → '+(dev.value?dev.value+' · ':'')+AGO[AG][1]+': '+pv+'</div>';
  var gs=raw?'<div data-g=1 style="padding:8px 16px;color:#aaa;cursor:pointer;font-size:16px" onclick="gsearch()">&#x1F50D; google: '+pv+'</div>':'';
  var nt=raw?['note','task'].map(function(k){return '<div data-n='+k+' onclick="sav(this.dataset.n,qi.value.trim())" style="padding:8px 16px;color:#999;cursor:pointer;font-size:16px">+ '+k+': '+pv+'</div>'}).join(''):'';
  qo.innerHTML=ph+ch+ci+gs+nt;hl();_pm(_t,'search')};dev.onchange=function(){fitsel(dev);qi.oninput()};show(views[location.hash]?location.hash:views[location.pathname]?location.pathname:'/');
document.addEventListener('keydown',function(e){if(!v_ag.classList.contains('on'))return;var k=e.key;if(k>='1'&&k<='9'&&+k<=AGO.length){e.preventDefault();agset(+k-1)}else if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();agsel(AG+(k==='ArrowDown'?1:-1))}else if(k==='Enter'||k==='Escape'){e.preventDefault();go('/');qi.focus()}});
qi.onkeydown=function(e){if(v_ag.classList.contains('on'))return;if(e.ctrlKey&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();agsel(AG+(e.key==='ArrowUp'?-1:1));qi.oninput();return}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();omni.requestSubmit();return}var it=_sg();if(!it.length)return;if(e.key==='ArrowDown'){e.preventDefault();_cs=Math.min(_cs+1,it.length-1)}else if(e.key==='ArrowUp'){e.preventDefault();_cs=Math.max(_cs-1,0)}else if(e.key==='Tab'&&it[_cs]){e.preventDefault();qi.value=it[_cs].dataset.c||it[_cs].textContent;qi.oninput();return}else return;hl()};
omni.onsubmit=function(e){e.preventDefault();var raw=qi.value.trim(),v=raw;if(!v){var s0=_sg()[_cs];if(s0&&s0.dataset.p)navpage(s0.dataset.p);return}
  var sh=_sg()[_cs];if(sh&&sh.dataset.n){sav(sh.dataset.n,raw);return}if(sh&&sh.dataset.g){gsearch();return}
  if(agv()=='note'||agv()=='task'){sav(agv(),raw);return}
  var pm=PAGES.filter(function(p){return p[1]===v||p[0]===v||p[0]==='/'+v});if(pm.length){qi.value='';navpage(pm[0][0]);return}
  if(views['/'+v]){go('/'+v);qi.value='';return}
  /* Enter takes the HIGHLIGHTED suggestion (pages first in DOM = first by default) — what you see is what runs */
  var sg=_sg();
  if(sg.length&&!/^\d+$/.test(v)&&!_cmds.some(function(c){return c[0]===v.split(' ')[0]})){var s=sg[_cs]||sg[0];
    if(s.dataset.p){qi.value='';navpage(s.dataset.p);return}
    if(s.dataset.c&&s.dataset.c.slice(0,8)==='web http'){window.open(s.dataset.c.slice(4),'_blank');qi.value='';qi.oninput();return}
    if(s.dataset.c)v=raw=s.dataset.c;}
  var tok=v.split(' ')[0],isagent=false;if(sh&&sh.dataset.a||!/^\d+$/.test(v)&&!_cmds.some(function(c){return c[0]===tok})){isagent=true;qh.textContent='→ '+(dev.value?dev.value+' · ':'')+AGO[AG][1]+': '+raw;qh.style.color='#fff';v=(dev.value?'ssh '+dev.value+' a ':'')+agv()+' '+raw+(dev.value?' ; echo --- windows --- ; tmux lsw -t a 2>&1 | tail -8':'');}else if(dev.value)v='ssh '+dev.value+' a '+v;qh.style.color='#555';
  var dv=dev.value;if(isagent)fetch('/api/savep',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent((dv||'local')+'\t'+agv()+'\t'+raw)});
  qo.innerHTML='<div style="padding:10px 16px;color:#ccc;font-size:17px">⏳ '+(dv?'sending to '+dv+' via ssh':'running')+'…</div><div style="padding:0 16px;color:#555;font-size:13px">a '+v.replace(/</g,'&lt;')+'</div>';
  fetch('/api/omni',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'q='+encodeURIComponent(v)}).then(function(r){return r.text()}).then(function(h){qi.value='';qi.style.height='auto';
    if(h&&/not a terminal|open terminal failed/i.test(h))h+='<div style="padding:8px 16px;color:#ccc;font-size:14px">ℹ sent — the new window in the list above confirms it launched on '+(dv||'remote')+'. the “not a terminal” is just the remote’s older <b>a</b> attaching a TTY over ssh; update for a clean report: <b>a ssh '+dv+' a u</b></div>';
    else if(h&&/No route to host|Connect failed|Connection refused|exited:|timed out|Could not resolve/i.test(h))h+='<div style="padding:8px 16px;color:#999;font-size:14px">ℹ '+(dv||'host')+' is unreachable at this address — it may be offline, or this entry’s IP is stale. try its other entry (e.g. the -wan vs -lan variant), or check the device is on.</div>';
    if(isagent){var ms=(h||'').match(/(?:claude|codex|gemini|grok)-[^\s(<:]+/g),win=ms?ms[ms.length-1]:'',wt=win?(dv?'ssh:'+dv+':'+win:win):'';
      h=(h||'')+'<div style="padding:8px 16px;color:#bbb;font-size:14px">↳ prompt saved to adata/git/prompts.log</div>';
      if(wt)h+='<div style="padding:4px 16px;color:#777;font-size:13px">'+(dv?dv+' · ':'')+win+' — see &amp; interact below:</div><iframe src="/op?w='+encodeURIComponent(wt)+'" style="width:100%;height:320px;border:1px solid #333;border-radius:8px;margin-top:6px"></iframe>';}
    if(h)qo.innerHTML=h;else qi.oninput();qi.focus()}).catch(function(){qo.innerHTML='<div style="padding:10px 16px;color:#fff;font-size:16px">✗ request failed — server unreachable</div>'})};
</script>
