<!doctype html>
<!-- term.html: direct-DOM terminal for a's /ws (tmux-backed), served at /op; /term = iframe. Runs positioned at col*cw,
     wide/odd glyphs clipped to exact cells = alignment by construction; tmux owns scrollback/selection. Zero deps.
     ?w=<win> ?fs=<px> ?host=<h:p> · verify: adata/git/my/term/test.py · out of scope until screamed (unk counter shows):
     F-keys, combining marks, DECOM, 47/1047/1048, SO/SI G1 -->
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>a term</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#scr{position:relative;width:100vw;height:100vh;overflow:hidden;cursor:text;color:#ccc}
.r{position:absolute;left:0;width:100%;contain:layout style}
.r span{position:absolute;top:0;white-space:pre}
#cur{position:absolute;background:#ccc;mix-blend-mode:difference;pointer-events:none}
#sb{position:fixed;top:2px;right:6px;font:11px monospace;color:#0f0;background:#000b;padding:1px 5px;z-index:9;pointer-events:none}
#kb{position:fixed;bottom:0;left:0;width:40%;height:1px;opacity:0;border:0;padding:0;resize:none;background:none}
</style>
<body>
<div id=scr></div><div id=po></div><div id=cur></div>
<textarea id=kb autocomplete=off autocapitalize=off spellcheck=false></textarea><div id=sb>boot</div>
<script>
'use strict';
const Q=new URLSearchParams(location.search),FS=+(Q.get('fs')||17),LH=Math.round(FS*1.25);
const FONT='ui-monospace,"Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono","Noto Sans Mono",monospace';
const PAL=['#000','#cd0000','#00cd00','#cdcd00','#26f','#cd00cd','#00cdcd','#e5e5e5','#7f7f7f','#f00','#0f0','#ff0','#5c5cff','#f0f','#0ff','#fff'];
for(let i=0;i<240;i++){

const W2=[[0x1100,0x115f],[0x2e80,0x303e],[0x3041,0x33ff],[0x3400,0x9fff],[0xa000,0xa4cf],[0xac00,0xd7a3],[0xf900,0xfaff],[0xfe30,0xfe4f],[0xff00,0xff60],[0xffe0,0xffe6],[0x1f000,0x1faff],[0x20000,0x3fffd]];
const W0=[[0x300,0x36f],[0x483,0x489],[0x591,0x5c7],[0x610,0x61a],[0x64b,0x65f],[0x6d6,0x6dc],[0x730,0x74a],[0x1ab0,0x1aff],[0x1dc0,0x1dff],[0x200b,0x200f],[0x20d0,0x20f0],[0xfe00,0xfe0f],[0xfe20,0xfe2f],[0xe0100,0xe01ef]];

/* fl bits: 1 bold 2 dim 4 italic 8 underline 16 reverse 32 invisible 64 strike | 128 WIDE 512 CONT */
let cols=0,rows=0,cw=9,chh=LH,G=[],RE=[],MAIN=null;
const DEF={x:0,y:0,fg:-1,bg:-1,fl:0,top:0,bot:0,wrap:true,ckm:false,vis:true,mouse:0,sgrm:false,paste:false,alt:false,pw:false,cs0:false,last:' ',lw:1,save:null};
const S=Object.assign({},DEF);
const newRow=()=>({t:Array(cols).fill(' '),f:Array(cols).fill(-1),b:Array(cols).fill(S.bg),l:Array(cols).fill(0)});
const sv=()=>S.save={x:S.x,y:S.y,fg:S.fg,bg:S.bg,fl:S.fl,pw:S.pw,cs0:S.cs0};
const rs=()=>{if(S.save)Object.assign(S,S.save);drow(S.y);};
let dirty=new Set(),raf=0,pt=0,dt=0,unk=0,wsOk=false,W=null,ty=0,rt=0,wn=Q.get('w')||'',ct=0,kt=0,kr=0,sm=0,ks=0,kf=0,gc=0,gl=0,polast='',curlast='',pd='',px0=0,py0=0,pcf=0;
function drow(y){
  dirty.add(y);
  if(!raf)raf=requestAnimationFrame(paint);
}
function dall(){for(let y=0;y<rows;y++)drow(y);}
function reset(){
  Object.assign(S,DEF,{bot:rows-1});
  MAIN=null;
  G=Array.from({length:rows},newRow);
  dall();
}
function clr(y,x0,x1){
  const r=G[y];
  if(!r)return;
  for(let i=Math.max(0,x0);i<=Math.min(cols-1,x1);i++){r.t[i]=' ';r.f[i]=-1;r.b[i]=S.bg;r.l[i]=0;}
  drow(y);
}
function scrl(n,dn){ /* scroll region top..bot; dn=reverse */

  for(let y=S.top;y<=S.bot;y++)drow(y);
}
function lf(){
  if(S.y===S.bot)scrl(1);
  else if(S.y<rows-1)S.y++;
}
function put(ch,w){
  if(w===0)return;

  S.pw=false;
  if(S.x+w>cols)S.x=Math.max(0,cols-w);
  const r=G[S.y];

/* parser: GROUND 0, ESC 1, CSI 2, STR 3 (OSC/DCS/APC swallowed), CHARSET 5 */
let st=0,pb='',ob='',cstgt=0;
const DEC=new TextDecoder();
function feed(d){

  if(typeof d!=='string')d=DEC.decode(d,{stream:true});
  for(const ch of d){
    const c=ch.codePointAt(0);
    if(st===3||st===4){
      if(c===7||c===27){if(st===3)title();st=c===27?1:0;}
      else if(st===3)ob+=ch;
      continue;
    }
    if(c===27){st=1;pb='';continue;}
    if(c<32){ctrl(c);continue;}
    if(st===1)escC(ch);
    else if(st===2)csiC(ch,c);
    else if(st===5){
      if(cstgt===0)S.cs0=ch==='0';
      st=0;
    }
    else if(c!==0x7f)put(S.cs0&&ACS[ch]?ACS[ch]:ch,wcw(c));
  }
  pt=performance.now()-t0;
  if(pd){if(S.y===py0&&S.x>=px0&&S.x<=px0+pd.length){const a=S.x-px0;if(a>0){gc+=a;gl=kr;pcf+=a;pd=pd.slice(a);px0=S.x;}}else{pd='';pcf=0;}}else pcf=0; /* reconcile: drop confirmed prefix; zone-left OR output-while-idle => disarm (password-safe) */
  if(!raf)raf=requestAnimationFrame(paint);
}
function title(){ /* OSC 0/2 "#S:#W" -> pin reconnects to the viewed window; OSC 52 -> browser clipboard (tmux copy auto-copies here) */
  const m=ob.match(/^[02];(?:[^:]*:)?(.*)$/);
  if(m){wn=m[1];document.title=m[1];return;}
  const c=ob.match(/^52;[^;]*;([A-Za-z0-9+/=]+)$/);
  if(c&&navigator.clipboard)navigator.clipboard.writeText(new TextDecoder().decode(Uint8Array.from(atob(c[1]),x=>x.charCodeAt(0)))).catch(()=>0);
}
function ctrl(c){
  if(c===8){if(S.pw)S.pw=false;else S.x=Math.max(0,S.x-1);}
  else if(c===9)S.x=Math.min(cols-1,(S.x&~7)+8);
  else if(c>=10&&c<=12)lf();
  else if(c===13){S.x=0;S.pw=false;}
}
function escC(ch){
  st=0;
  if(ch==='[')st=2;
  else if(ch===']'){st=3;ob='';}
  else if(ch==='P'||ch==='X'||ch==='^'||ch==='_')st=4;
  else if(ch==='('||ch===')'){st=5;cstgt=ch==='('?0:1;}
  else if(ch==='7')sv();
  else if(ch==='8')rs();
  else if(ch==='D')lf();
  else if(ch==='M'){if(S.y===S.top)scrl(1,true);else if(S.y>0)S.y--;}
  else if(ch==='E'){S.x=0;lf();}
  else if(ch==='c')reset();
  else if(ch!=='='&&ch!=='>'&&ch!=='\\')unk++;
}
function csiC(ch,c){
  if(c>=0x30&&c<=0x3f)pb+=ch;
  else if(c>=0x20&&c<=0x2f);   /* intermediates: none we act on */
  else if(c>=0x40&&c<=0x7e){st=0;csi(pb,ch);}
  else st=0;
}
function csi(p,f){

  else if(f==='C'){S.pw=false;S.x=Math.min(cols-1,S.x+n1(0));}
  else if(f==='D'){S.pw=false;S.x=Math.max(0,S.x-n1(0));}
  else if(f==='G'){S.pw=false;S.x=Math.min(cols-1,n1(0)-1);}

  else if(f==='d'){S.pw=false;S.y=Math.min(rows-1,n1(0)-1);}

    if(f==='J')for(let y=m===0?S.y+1:0;y<=(m===1?S.y-1:rows-1);y++)if(y!==S.y)clr(y,0,cols-1);

  else if(f==='L'||f==='M'){ /* IL/DL */

      if(f==='@'){r[q].splice(S.x,0,...Array(k).fill(fill));r[q].length=cols;}
      else{r[q].splice(S.x,k);r[q].push(...Array(k).fill(fill));}
    }
    drow(S.y);
  }
  else if(f==='X')clr(S.y,S.x,S.x+n1(0)-1);
  else if(f==='S')scrl(n1(0));

const MODES={1:'ckm',7:'wrap',25:'vis',1006:'sgrm',2004:'paste'};
function mode(priv,v,on){
  if(!priv){if(v!==34)unk++;return;} /* 34 = cursor-blink (tmux-256color cnorm) */
  if(MODES[v]){
    S[MODES[v]]=on;
    if(v===25)drow(S.y);
  }
  else if(v===1049){
    if(on&&!S.alt){sv();MAIN=G;G=Array.from({length:rows},newRow);S.alt=true;dall();}
    else if(!on&&S.alt){G=MAIN;MAIN=null;S.alt=false;rs();fitGrid(G);dall();}

  else if(v===1000||v===1002||v===1003)S.mouse=on?v:0;
  else if(v!==12&&v!==1004&&v!==1005&&v!==2031&&v!==7727)unk++;

const SGRF={1:1,2:2,3:4,7:16,8:32,9:64},SGRC={21:3,22:3,23:4,24:8,27:16,28:32,29:64};
function sgr(a){
  for(let i=0;i<a.length;i++){

    if(v===0){S.fg=-1;S.bg=-1;S.fl=0;}
    else if(SGRF[v])S.fl|=SGRF[v];

    else if(v===4)S.fl=parseInt(sub[1])===0?S.fl&~8:S.fl|8;
    else if(v>=30&&v<=37)S.fg=v-30;
    else if(v===39)S.fg=-1;
    else if(v>=40&&v<=47)S.bg=v-40;
    else if(v===49)S.bg=-1;
    else if(v>=90&&v<=97)S.fg=v-82;
    else if(v>=100&&v<=107)S.bg=v-92;

const esc=s=>s.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');
const col=v=>v<256?PAL[v]:'#'+(v&0xffffff|0x1000000).toString(16).slice(1);

function style(x,f,b,l,w){

  let s='left:'+(x*cw).toFixed(2)+'px';
  if(w)s+=';display:inline-block;overflow:hidden;width:'+(w*cw).toFixed(2)+'px';
  if(fg>=0)s+=';color:'+col(fg);
  if(bg>=0)s+=';background:'+col(bg);
  if(l&1)s+=';font-weight:bold';
  if(l&2)s+=';opacity:.6';
  if(l&4)s+=';font-style:italic';

function rowhtml(r){

      i+=l&128?2:1;
      continue;

function paint(){

  const ph=pon?[...pd].map((c,i)=>'<span style="position:absolute;left:'+((px0+i)*cw).toFixed(2)+'px;top:'+py0*chh+'px">'+(c==='<'?'&lt;':c==='&'?'&amp;':c)+'</span>').join(''):'';

function stat(){ /* 1ms mandate: p=parse d=draw s=key→shown r=key→echo(worked) */

function fitGrid(g){

function fit(){

  po.style.cssText='position:absolute;left:0;top:0;color:#ccc;pointer-events:none;font:'+FS+'px/'+LH+'px '+FONT;
  scr.appendChild(e);

function sizeTo(c,r){

  scr.textContent='';

  for(let y=0;y<rows;y++){
    const d=document.createElement('div');
    d.className='r';
    d.style.top=y*chh+'px';
    d.style.height=chh+'px';

function connect(){
  if(W&&W.readyState<2)return;

  W.binaryType='arraybuffer';
  W.onopen=()=>{wsOk=true;ct=performance.now();W.send(JSON.stringify({cols,rows}));stat();};
  W.onmessage=e=>feed(typeof e.data==='string'?e.data:new Uint8Array(e.data));

function tx(s){
  if(Q.get('test')){T.sent.push(s);return;}

  let i=0;
  while(i<s.length){ /* frame cap 4095B; keep surrogates whole */

    if(j<s.length&&s.charCodeAt(j-1)>=0xd800&&s.charCodeAt(j-1)<0xdc00)j++;

const KM={ArrowUp:'A',ArrowDown:'B',ArrowRight:'C',ArrowLeft:'D',Home:'H',End:'F'};
const KN={Delete:3,PageUp:5,PageDown:6};
function key(e){
